[project]
name = "cqk1af"
version = "0.1.0"
description = "MCP server + dashboard that assists with voice SSB QSOs on a FlexRadio 6400"
requires-python = ">=3.11"
readme = "README.md"
authors = [{ name = "K1AF" }]
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "structlog>=24.1",
    "PyYAML>=6.0",
    "anyio>=4.3",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "websockets>=12.0",
    "httpx>=0.27",
    "mcp>=1.2",
    "click>=8.1",
]

[project.optional-dependencies]
audio = [
    # sounddevice 0.5.x ships a PortAudio binary that crashes with
    # STATUS_HEAP_CORRUPTION during init on some Windows hosts (observed
    # against SmartSDR DAX drivers). 0.4.7 is stable.
    "sounddevice>=0.4,<0.5",
    "numpy>=1.26",
    "webrtcvad>=2.0.10",
]
stt = [
    "faster-whisper>=1.0",
]
cuda = [
    # NVIDIA CUDA runtime DLLs that CTranslate2 (under faster-whisper) needs
    # for GPU inference on Windows. Without these on the DLL search path,
    # the encoder fails with "Library cublas64_12.dll is not found or cannot
    # be loaded" even on hosts with a working CUDA toolkit. WhisperSTTEngine
    # registers the pip-shipped DLL dirs via ``os.add_dll_directory`` + PATH
    # before importing ctranslate2. Skip if you don't have an NVIDIA GPU.
    "nvidia-cublas-cu12; sys_platform == 'win32'",
    "nvidia-cudnn-cu12; sys_platform == 'win32'",
    "nvidia-cuda-runtime-cu12; sys_platform == 'win32'",
    "nvidia-cuda-nvrtc-cu12; sys_platform == 'win32'",
]
radio = [
    "pythonnet>=3.0; sys_platform == 'win32'",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "hypothesis>=6.99",
    "ruff>=0.4",
    "mypy>=1.9",
]

[project.scripts]
cqk1af = "cqk1af.__main__:main"

[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cqk1af"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
